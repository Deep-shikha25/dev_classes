<<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> To-Do List</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0f0f1a;
}

/* Container */

.container{
width:400px;
padding:30px;
border-radius:15px;
background:#111;
box-shadow:0 0 20px #00f2ff55;
}

/* Title */

h2{
text-align:center;
color:#00f2ff;
margin-bottom:20px;
text-shadow:0 0 10px #00f2ff, 0 0 20px #00f2ff;
}

/* Input Section */

.input-section{
display:flex;
gap:10px;
margin-bottom:20px;
}

input{
flex:1;
padding:12px;
border:none;
outline:none;
border-radius:6px;
background:#1b1b2f;
color:white;
box-shadow:0 0 5px #00f2ff inset;
}

input::placeholder{
color:#888;
}

/* Add Button */

button{
padding:12px 18px;
border:none;
border-radius:6px;
background:#00f2ff;
color:#000;
font-weight:bold;
cursor:pointer;
transition:0.3s;
box-shadow:0 0 10px #00f2ff,0 0 20px #00f2ff;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px #00f2ff,0 0 40px #00f2ff;
}

/* Task List */

ul{
list-style:none;
}

li{
display:flex;
justify-content:space-between;
align-items:center;
background:#1a1a2e;
padding:12px;
margin-bottom:12px;
border-radius:6px;
color:white;
transition:0.3s;
box-shadow:0 0 5px #00f2ff33;
}

li:hover{
transform:translateX(5px);
box-shadow:0 0 10px #00f2ff;
}

/* Completed task */

.completed{
text-decoration:line-through;
opacity:0.5;
}

/* Delete Button */

.delete-btn{
background:#ff2e63;
padding:6px 10px;
border-radius:5px;
border:none;
color:white;
cursor:pointer;
box-shadow:0 0 10px #ff2e63;
transition:0.3s;
}

.delete-btn:hover{
box-shadow:0 0 20px #ff2e63,0 0 40px #ff2e63;
}

</style>
</head>

<body>

<div class="container">

<h2>⚡To-Do List</h2>

<div class="input-section">
<input type="text" id="taskInput" placeholder="Add a new task...">
<button onclick="addTask()">Add</button>
</div>

<ul id="taskList"></ul>

</div>

<script>

const input=document.getElementById("taskInput");

input.addEventListener("keypress",function(e){
if(e.key==="Enter"){
addTask();
}
});

function addTask(){

let task=input.value.trim();

if(task===""){
alert("Enter a task first!");
return;
}

let li=document.createElement("li");

let span=document.createElement("span");
span.textContent=task;

span.addEventListener("click",function(){
li.classList.toggle("completed");
});

let delBtn=document.createElement("button");
delBtn.textContent="X";
delBtn.className="delete-btn";

delBtn.onclick=function(){
li.remove();
};

li.appendChild(span);
li.appendChild(delBtn);

document.getElementById("taskList").appendChild(li);

input.value="";
}

</script>

</body>
</html>
